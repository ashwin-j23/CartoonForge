name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-render.txt}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -r backend/requirements-render.txt
      - run: python scripts/scan_secrets.py
      - working-directory: backend
        run: TTS_ENGINE=espeak KOKORO_ENABLED=0 python -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - working-directory: frontend
        run: npm ci && npm run build
